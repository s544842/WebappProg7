<!DOCTYPE html>
<html lang="en">
<head>
  <title>Webapps Program 7 [II]</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"   
  integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.min.js" 
  integrity="sha384-7VPbUDkoPSGFnVtYi0QogXtr74QeVeeIs99Qfg5YCF+TidwNdjvaKZX19NZ/e6oz" crossorigin="anonymous"></script>


</head>
<body>
  <h1> Logan Masters Reflexes</h1>

  <div id="result">Stop as close to 0 as possible.</div>
  <div id="best">Best time: </div>
  <div id="counter" >00:00.000</div>

  <button id="btn" type="button" class="btn btn-success" onclick="startTimer()">Go</button>
  
  <script> 
    const result = document.getElementById("result");
    const best = document.getElementById("best");
    const display = document.getElementById("counter");
    const actionBtn = document.getElementById("btn");

    const countdown_duration = 5000;

    let startTime = 0;
    let timeoutId = null;
    let timeRemaining = countdown_duration;
    let bestTime = 5000;

    display.textContent = "00:05.000";

    actionBtn.addEventListener("click", (event) => 
    {
      event.preventDefault();
      event.stopPropagation();

      const currentText = actionBtn.textContent.trim().toLowerCase();

      if (currentText === "go") 
      {
        actionBtn.textContent = "Stop";
        actionBtn.className = "btn btn-danger";
        
        startTime = performance.now() - (countdown_duration - timeRemaining);
        
        if (timeoutId) clearTimeout(timeoutId); 
        runTimer();

      } 
      else if (currentText === "stop") 
      {
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = null;
        
        actionBtn.textContent = "Reset";
        actionBtn.className = "btn btn-warning";
        if (timeRemaining < bestTime)
        {
          bestTime = timeRemaining;
          best.textContent = "Best time: " + formatTime(bestTime);
        }
      } 
      else if (currentText === "reset")
      {
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = null;
        
        timeRemaining = countdown_duration;
        display.textContent = "00:05.000";
        result.textContent = "Stop as close to 0 as possible.";
        
        actionBtn.textContent = "Go";
        actionBtn.className = "btn btn-success";
      }

    });

    function runTimer() 
    {
      if (actionBtn.textContent.trim().toLowerCase() !== "stop") return;

      const elapsedTime = performance.now() - startTime;
      timeRemaining = countdown_duration - elapsedTime;

      if (timeRemaining <= 0) 
      {
        timeRemaining = 0;
        display.textContent = formatTime(timeRemaining);
        
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = null;
        
        actionBtn.textContent = "Reset";
        actionBtn.className = "btn btn-warning";
        result.textContent = "Try again.";

        return;
      }
      display.textContent = formatTime(timeRemaining);

      timeoutId = setTimeout(runTimer, 1);
    }

    function formatTime(ms) 
    {
      if (!ms || ms < 0 || isNaN(ms)) return "00:00.000";
      
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = Math.floor(ms % 1000);

      return (
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0') + '.' +
        String(milliseconds).padStart(3, '0')
      );
    }

  </script>

</body>
</html>
