  <script>
    ids = [];
    for (let i = 1; i < 37; i++)
  {
    ids.push(String(i));
  }
  score = 0;
  locationsVisited = 0;
  lastLocation = 0;
  poisonLocation = 19;
  roseLocation = 14;
  lilyLocations = [3,25];
  daisyLocations = [2,5,11,20,21];
  gameOver = false;
  
  function check(position)
  {
    if(gameOver == false)
  {
    let img = document.getElementById(position);
    if (position == poisonLocation)
      {
        console.log("posion");
        img.src = "img/ivy.jpeg";
        document.getElementById(position).onClick = "";
        gameOver = true;
        score -= 4;
        document.getElementById("score").style = "color:red";
      }
      else if (position == roseLocation)
      {
        img.src = "img/rose.jpg";
        document.getElementById(position).onClick = "";
        score += 4;
      }
      else if (lilyLocations.includes(position))
      {
        img.src = "img/lily.webp";
        document.getElementById(position).onClick = "";
        score += 2;
      }
      else if (daisyLocations.includes(position))
      {
        img.src = "img/daisy.jpeg";
        document.getElementById(position).onClick = "";
        score += 1;
      }
    }
    locationsVisited += 1;
    lastLocation = position;
    document.getElementById("locations").innerHTML = "Number of locations checked is " + locationsVisited;
    document.getElementById("score").innerHTML = "Score is " + score;
  }
  
  function help()
  {
    let help = document.getElementById("help");
    closest4 = [lastLocation - 1, lastLocation + 1, lastLocation - 6, lastLocation + 6];
    closest9 = [lastLocation - 7, lastLocation - 6, lastLocation - 5, lastLocation - 1, lastLocation, lastLocation + 1, lastLocation + 5, lastLocation + 6, lastLocation + 7];
    console.log(closest4.some(item => daisyLocations.includes(item)));
  if (closest9.includes(poisonLocation))
  {
    help.innerHTML = "Click for help: watch out";
  }
  else if (closest9.includes(roseLocation))
  {
    help.innerHTML = "Click for help: hot";
  }
  else if (closest4.some(item => daisyLocations.includes(item)))
  {
    help.innerHTML = "Click for help: cold";
  }
  else help.innerHTML = "Click for help: warm";
  }
</script>
